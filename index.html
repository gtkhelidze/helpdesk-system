<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>პრობლემის დაფიქსირება (Helpdesk)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-900 font-sans p-6 text-gray-100">
    <div class="max-w-full mx-auto space-y-8">
        <!-- ფორმის ბლოკი -->
        <div class="bg-gray-800 p-6 rounded-lg shadow-xl border border-gray-700">
            <h1 class="text-2xl font-bold text-white mb-6">პრობლემის დაფიქსირება</h1>
            
            <h2 class="text-lg font-semibold mb-4 text-gray-200">შეიყვანეთ დეტალები</h2>
            <form id="issueForm" class="space-y-4">
                <div class="max-w-md">
                    <label class="block text-sm font-medium text-gray-300 mb-1">თანამშრომელი (სახელი გვარი)</label>
                    <input type="text" id="employee" placeholder="მაგ: გაიოზ თხელიძე" required class="w-full bg-gray-900 border border-gray-700 p-2.5 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 transition-colors">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">დეპარტამენტი</label>
                        <select id="department" required class="w-full bg-gray-900 border border-gray-700 p-2.5 rounded-lg text-white focus:outline-none focus:border-blue-500 transition-colors">
                            <option value="" disabled selected>აირჩიეთ დეპარტამენტი</option>
                            <option value="ბირჟა">ბირჟა</option>
                            <option value="დეპოზიტარი">დეპოზიტარი</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">პრიორიტეტი</label>
                        <select id="priority" required class="w-full bg-gray-900 border border-gray-700 p-2.5 rounded-lg text-white focus:outline-none focus:border-blue-500 transition-colors">
                            <option value="low">დაბალი (Low)</option>
                            <option value="medium" selected>საშუალო (Medium)</option>
                            <option value="high">მაღალი (High)</option>
                            <option value="urgent">კრიტიკული (Urgent)</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">პრობლემის აღწერა</label>
                    <textarea id="description" rows="3" placeholder="აღწერეთ პრობლემა დეტალურად..." required class="w-full bg-gray-900 border border-gray-700 p-3 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 transition-colors resize-y"></textarea>
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white p-3 rounded-lg font-semibold hover:bg-blue-500 cursor-pointer transition-colors shadow-lg shadow-blue-600/20">პრობლემის გაგზავნა</button>
            </form>
            
            <div id="successMessage" class="hidden mt-4 p-3 bg-emerald-950 border border-emerald-700 text-emerald-200 rounded-lg text-center font-medium">
                პრობლემა წარმატებით დაფიქსირდა და გაიგზავნა ბაზაში!
            </div>
        </div>

        <!-- ჩემი დაფიქსირებული პრობლემების სია -->
        <div class="bg-gray-800 p-6 rounded-lg shadow-xl border border-gray-700">
            <h2 class="text-lg font-semibold mb-4 text-gray-200">ჩემი დაფიქსირებული პრობლემები</h2>
            <div>
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-900/60 text-gray-400 text-sm border-b border-gray-700">
                            <th class="p-3 whitespace-nowrap">ID</th>
                            <th class="p-3 whitespace-nowrap">დეპარტამენტი</th>
                            <th class="p-3 whitespace-nowrap">პრიორიტეტი</th>
                            <th class="p-3">აღწერა</th>
                            <th class="p-3 whitespace-nowrap">შემსრულებელი</th>
                            <th class="p-3">კომენტარი / შენიშვნა</th>
                            <th class="p-3 whitespace-nowrap">შემოსვლის თარიღი</th>
                            <th class="p-3 whitespace-nowrap">დასრულების თარიღი</th>
                            <th class="p-3 whitespace-nowrap">სტატუსი</th>
                        </tr>
                    </thead>
                    <tbody id="myIssuesTable" class="text-sm text-gray-300 divide-y divide-gray-700/40">
                        <tr><td colspan="9" class="p-6 text-center text-gray-500">მონაცემები არ არის</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxPlpjHl_k4GPw0zYH2oPGhPaVP8cMG5oNBwwg6YTqK7DXuS-rcJ7nA7zaolGuOhL0I/exec";

        function getIssues() {
            let issues = localStorage.getItem('helpdesk_issues');
            return issues ? JSON.parse(issues) : [];
        }

        function saveIssues(issues) {
            localStorage.setItem('helpdesk_issues', JSON.stringify(issues));
        }

        function renderMyIssues() {
            const issues = getIssues();
            const tbody = document.getElementById('myIssuesTable');
            const savedEmployee = localStorage.getItem('helpdesk_last_employee') || '';

            const myIssues = savedEmployee ? issues.filter(i => i.employee.toLowerCase() === savedEmployee.toLowerCase()) : [];

            if (myIssues.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" class="p-6 text-center text-gray-500">თქვენი დაფიქსირებული პრობლემები ვერ მოიძებნა</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            myIssues.forEach(issue => {
                let statusBadge = '';
                if (issue.status === 'new') statusBadge = '<span class="text-red-400 font-semibold">new</span>';
                else if (issue.status === 'taken') statusBadge = '<span class="text-amber-400 font-semibold">taken</span>';
                else if (issue.status === 'onsite') statusBadge = '<span class="text-purple-400 font-semibold">onsite</span>';
                else if (issue.status === 'closed') statusBadge = '<span class="text-emerald-400 font-semibold">closed</span>';

                let priorityBadge = '';
                if (issue.priority === 'urgent') priorityBadge = '<span class="px-2 py-0.5 bg-red-950 text-red-300 rounded text-xs font-bold border border-red-800">Urgent</span>';
                else if (issue.priority === 'high') priorityBadge = '<span class="px-2 py-0.5 bg-orange-950 text-orange-300 rounded text-xs font-bold border border-orange-800">High</span>';
                else if (issue.priority === 'medium') priorityBadge = '<span class="px-2 py-0.5 bg-blue-950 text-blue-300 rounded text-xs font-bold border border-blue-800">Medium</span>';
                else priorityBadge = '<span class="px-2 py-0.5 bg-gray-800 text-gray-300 rounded text-xs font-bold border border-gray-700">Low</span>';

                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-3 align-top whitespace-nowrap font-bold text-white">#${issue.id}</td>
                    <td class="p-3 align-top whitespace-nowrap">
                        <span class="px-2 py-1 bg-gray-900 border border-gray-700 rounded text-xs font-semibold text-gray-300">${issue.department}</span>
                    </td>
                    <td class="p-3 align-top whitespace-nowrap">
                        ${priorityBadge}
                    </td>
                    <td class="p-3 align-top text-gray-300 break-words">${issue.description}</td>
                    <td class="p-3 align-top text-blue-400 font-medium whitespace-nowrap">${issue.resolver ? issue.resolver : '-'}</td>
                    <td class="p-3 align-top text-gray-300 italic break-words">${issue.admin_comment ? issue.admin_comment : '-'}</td>
                    <td class="p-3 align-top text-gray-400 text-xs whitespace-nowrap">${issue.created_at}</td>
                    <td class="p-3 align-top text-gray-400 text-xs whitespace-nowrap">${issue.closed_at ? issue.closed_at : '-'}</td>
                    <td class="p-3 align-top whitespace-nowrap">${statusBadge}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('issueForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const employee = document.getElementById('employee').value;
            const department = document.getElementById('department').value;
            const priority = document.getElementById('priority').value;
            const description = document.getElementById('description').value;
            
            localStorage.setItem('helpdesk_last_employee', employee);

            const now = new Date().toISOString().slice(0, 19).replace('T', ' ');

            const issues = getIssues();
            const newId = issues.length > 0 ? issues[0].id + 1 : 1;
            
            const newIssue = {
                id: newId,
                created_at: now,
                employee: employee,
                department: department,
                priority: priority,
                description: description,
                status: 'new',
                resolver: '',
                admin_comment: '',
                closed_at: null
            };

            // მონაცემების მომზადება Google Sheet-ისთვის (სვეტების მიხედვით)
            const sheetData = {
                name: employee,
                category: department,
                subject: "პრიორიტეტი: " + priority,
                description: description
            };

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'იგზავნება ბაზაში...';

            // Google Sheet-ში გაგზავნა
            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(sheetData)
            })
            .then(() => {
                // ლოკალურადაც ვამატებთ და ვინახავთ
                issues.unshift(newIssue);
                saveIssues(issues);
                
                document.getElementById('description').value = '';
                renderMyIssues();
                
                const msg = document.getElementById('successMessage');
                msg.classList.remove('hidden');
                setTimeout(() => msg.classList.add('hidden'), 5000);

                submitBtn.disabled = false;
                submitBtn.textContent = 'პრობლემის გაგზავნა';
            })
            .catch(error => {
                console.error('შეცდომა:', error);
                alert('ბაზაში გაგზავნისას მოხდა შეცდომა.');
                submitBtn.disabled = false;
                submitBtn.textContent = 'პრობლემის გაგზავნა';
            });
        });

        setInterval(() => {
            renderMyIssues();
        }, 1000);

        window.addEventListener('DOMContentLoaded', () => {
            const savedEmployee = localStorage.getItem('helpdesk_last_employee');
            if (savedEmployee) {
                document.getElementById('employee').value = savedEmployee;
                renderMyIssues();
            }
        });
    </script>
</body>
</html>
